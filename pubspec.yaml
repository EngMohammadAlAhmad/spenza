name: spenza
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  internet_connection_checker_plus:
  dio:
  shared_preferences:
  dartz:
  flutter_bloc:
  equatable:
  get_it:
  bloc_concurrency:
  go_router:
  flutter_svg:
  cached_network_image:
  intl:
  easy_localization:
  image_picker:
  flutter_secure_storage:
  carousel_slider:
  smooth_page_indicator:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/
    - assets/images/
    - assets/images/temp/

  fonts:
    - family: Zain
      fonts:
        - asset: assets/fonts/Zain-Light.ttf
          weight: 300

        - asset: assets/fonts/Zain-Regular.ttf
          weight: 400

        - asset: assets/fonts/Zain-Bold.ttf
          weight: 700

        - asset: assets/fonts/Zain-ExtraBold.ttf
          weight: 800